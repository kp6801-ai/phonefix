<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>phonefix showcase (recorded to demo.gif / demo.mp4 by scripts/record-demo.mjs)</title>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@800&family=Funnel+Sans:wght@400;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0b0b0c; --paper:#faf8f3; --lemon:#ffd95a; --lime:#c8f25c; --mute:#8f8f80; }
  html, body { margin:0; width:1280px; height:720px; overflow:hidden; background:var(--ink); color:var(--paper); font-family:'Funnel Sans',sans-serif; }
  .stage { position:relative; width:1280px; height:720px; }
  .orb { position:absolute; top:28px; left:50%; transform:translateX(-50%); width:56px; height:56px; animation:spin 24s linear infinite; }
  @keyframes spin { to { transform:translateX(-50%) rotate(360deg); } }
  .head { position:absolute; top:96px; left:0; right:0; text-align:center; }
  .head h1 { font-family:'Funnel Display'; font-weight:800; font-size:44px; letter-spacing:-.03em; line-height:1; margin:0; }
  .head h1 em { font-style:normal; color:var(--lemon); }
  .label { font-family:'Geist Mono'; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--mute); }
  .devices { position:absolute; top:200px; left:0; right:0; display:flex; justify-content:center; align-items:flex-end; gap:56px; }
  .laptop { position:relative; }
  .laptop .screen { width:700px; height:437px; background:#000; border:10px solid #1c1c1f; border-bottom:0; border-radius:18px 18px 0 0; overflow:hidden; position:relative; box-shadow:0 30px 80px -30px rgba(0,0,0,.9); }
  .laptop .base { width:800px; height:16px; margin-left:-50px; background:linear-gradient(#2a2a2e,#141416); border-radius:0 0 14px 14px; }
  .laptop .base::after { content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:8px; width:120px; height:5px; border-radius:0 0 6px 6px; background:#0a0a0b; }
  .laptop iframe { width:1440px; height:900px; border:0; transform:scale(.4861); transform-origin:0 0; position:absolute; top:0; left:0; pointer-events:none; }
  .phone { position:relative; }
  .phone .screen { width:230px; height:498px; background:#000; border:9px solid #1c1c1f; border-radius:34px; overflow:hidden; position:relative; box-shadow:0 30px 80px -30px rgba(0,0,0,.9); }
  .phone .screen::before { content:''; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:84px; height:22px; background:#000; border-radius:12px; z-index:3; }
  .phone iframe { width:375px; height:812px; border:0; transform:scale(.6133); transform-origin:0 0; position:absolute; top:0; left:0; pointer-events:none; }
  .tag { position:absolute; left:50%; transform:translateX(-50%); top:-40px; white-space:nowrap; font-family:'Geist Mono'; font-size:12px; text-transform:uppercase; letter-spacing:.08em; padding:8px 14px; border-radius:100px; }
  .tag.bad { background:var(--lemon); color:var(--ink); } .tag.good { background:var(--lime); color:var(--ink); }
  .cmd { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); border-radius:100px; padding:14px 26px; font-family:'Geist Mono'; font-size:18px; display:flex; gap:14px; align-items:center; opacity:0; }
  .cmd .k { color:#1a7f37; }
  .credit { position:absolute; bottom:24px; left:36px; font-family:'Geist Mono'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
</style>
</head>
<body>
<div class="stage">
  <img class="orb" src="assets/orb.svg" alt="">
  <div class="head"><div class="label">phonefix · one command. every phone.</div><h1>Built for a <em>laptop</em>. Fixed for every <em>thumb</em>.</h1></div>
  <div class="devices">
    <div class="laptop"><div class="screen"><iframe id="lap" src="../examples/laptop-only/" title="laptop-only demo"></iframe></div><div class="base"></div><span class="tag bad">What your AI saw · 1440px</span></div>
    <div class="phone"><div class="screen"><iframe id="ph" src="../examples/fixed/" title="fixed demo"></iframe></div><span class="tag good">What phonefix shipped · iPhone · 0 issues</span></div>
  </div>
  <div class="cmd"><span>$</span><span><span class="k">npx</span> skills add kp6801-ai/phonefix</span></div>
  <div class="credit">by SPIKE Studio · Dubai</div>
</div>
<script>
  // Auto-scroll both demos over ~8 s so ScrollTrigger pins and the 3D scenes run on camera.
  const ease = t => t < .5 ? 2*t*t : -1 + (4 - 2*t)*t;
  const scrollOver = (win, from, to, ms) => new Promise(res => { const t0 = performance.now(); (function f(now){ const p = Math.min(1, (now - t0)/ms); win.scrollTo(0, from + (to - from)*ease(p)); if (p < 1) requestAnimationFrame(f); else res(); })(t0); });
  window.__showcase = (async () => {
    if (location.search.includes('still')) return 'still';
    const lap = document.getElementById('lap'), ph = document.getElementById('ph');
    await Promise.all([lap, ph].map(f => new Promise(r => f.contentDocument && f.contentDocument.readyState === 'complete' ? r() : f.addEventListener('load', r))));
    await new Promise(r => setTimeout(r, 1200));
    const L = lap.contentWindow, P = ph.contentWindow;
    const lMax = L.document.documentElement.scrollHeight - L.innerHeight, pMax = P.document.documentElement.scrollHeight - P.innerHeight;
    await Promise.all([scrollOver(L, 0, lMax, 7000), scrollOver(P, 0, pMax, 7000)]);
    document.querySelector('.cmd').animate([{ opacity: 0, transform: 'translate(-50%, 12px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 500, fill: 'forwards', easing: 'cubic-bezier(.16,1,.3,1)' });
    await new Promise(r => setTimeout(r, 1600));
    await Promise.all([scrollOver(L, lMax, 0, 1200), scrollOver(P, pMax, 0, 1200)]);
    return 'done';
  })();
</script>
</body>
</html>
