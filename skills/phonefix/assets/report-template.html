<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@800&family=Funnel+Sans:wght@400;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0b0b0c; --paper:#faf8f3; --card:#fffdf9; --accent:#ffd95a; --lime:#c8f25c; --mute:#8f8f80; --soft:#3a3a30; --red:#e5484d; --r:22px; --ease:cubic-bezier(.16,1,.3,1);
    --d:'Funnel Display',system-ui,sans-serif; --b:'Funnel Sans',system-ui,sans-serif; --m:'Geist Mono',ui-monospace,monospace; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--b); font-size:16px; line-height:1.5; padding:0 16px calc(32px + env(safe-area-inset-bottom)); }
  .wrap { width:min(1320px,100%); margin:0 auto; }
  h1,h2,h3 { font-family:var(--d); font-weight:800; letter-spacing:-.03em; line-height:.96; margin:0; }
  h1 { font-size:clamp(34px,7vw,72px); }
  h2 { font-size:clamp(24px,4vw,40px); margin:56px 0 20px; }
  .label { font-family:var(--m); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  header { padding:28px 0 8px; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between; }
  .verdict { border-radius:var(--r); padding:22px 24px; margin:20px 0 8px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; border:1.5px solid var(--ink); }
  .verdict.pass { background:var(--lime); } .verdict.fail { background:var(--accent); } .verdict.warn { background:var(--card); }
  .verdict strong { font-family:var(--d); font-size:clamp(22px,4vw,34px); letter-spacing:-.03em; }
  .pill { display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 12px; border-radius:100px; border:1.5px solid var(--ink); background:#fff; font-family:var(--m); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .pill.s4 { background:var(--ink); color:var(--accent); } .pill.s3 { background:var(--accent); } .pill.s2 { background:#fff; } .pill.s1 { color:var(--mute); border-color:var(--mute); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r); overflow:hidden; display:block; overflow-x:auto; }
  th,td { text-align:left; padding:12px 14px; border-bottom:1px solid #e6e2d8; vertical-align:top; font-size:15px; }
  th { font-family:var(--m); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); background:#f3efe6; }
  tr:last-child td { border-bottom:0; }
  td.num { font-family:var(--m); white-space:nowrap; }
  .delta-up { color:#1a7f37; font-weight:600; } .delta-down { color:var(--red); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .dev { background:var(--card); border:1.5px solid var(--ink); border-radius:16px; padding:12px; }
  .dev .name { font-weight:600; font-size:14px; } .dev .meta { font-family:var(--m); font-size:11px; color:var(--mute); margin-bottom:8px; }
  .dev .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dev .pair.single { grid-template-columns:1fr; }
  .dev figure { margin:0; } .dev figcaption { font-family:var(--m); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin-top:4px; }
  .dev img { width:100%; height:auto; display:block; border-radius:8px; border:1px solid #d9d4c8; background:#fff; }
  .dev .counts { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px; }
  .issue td.sel { font-family:var(--m); font-size:12px; word-break:break-all; max-width:260px; }
  .fix { color:var(--soft); }
  details { margin-top:10px; } summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; }
  footer { margin-top:64px; padding-top:20px; border-top:1.5px solid var(--ink); display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:space-between; font-size:14px; color:var(--mute); }
  footer a { color:var(--ink); }
  @media (prefers-reduced-motion:reduce) { *{ animation:none!important; transition:none!important; } }
</style>
</head>
<body>
<div class="wrap">
<!--PHONEFIX:CONTENT-->
<footer><span>phonefix report · generated {{DATE}}</span><span>Built by <a href="https://spikestudiodxb.com">SPIKE Studio</a> · <a href="https://github.com/kp6801-ai/phonefix">github.com/kp6801-ai/phonefix</a></span></footer>
</div>
</body>
</html>
